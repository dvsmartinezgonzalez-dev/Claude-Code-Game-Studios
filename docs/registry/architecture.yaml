# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: singleton_access
    status: active
    pattern: direct_call
    description: "All singleton managers are accessed via static Instance property set in Awake. No runtime scene scans (FindFirstObjectByType / FindObjectsByType) for singleton retrieval on any hot path."
    adr: docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    referenced_by:
      - docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    added: 2026-05-02
    revised: ""

  - contract: async_ready_pattern
    status: active
    pattern: direct_call
    description: "Any system with async initialization must expose bool IsReady + event Action OnReady. Callers must use subscribe-then-check: subscribe first, then check IsReady and call handler immediately if already true. This prevents the race condition where the event fires before the subscriber registers."
    adr: docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    example: |
      system.OnReady += HandleReady;
      if (system.IsReady) HandleReady();
    systems_using_pattern:
      - SaveSystem (OnSaveReady / IsReady)
      - LevelDataSystem (IsReady)
      - CoinEconomy (CE FSM LOADING/READY — internally driven by SaveSystem.OnSaveReady)
    referenced_by:
      - docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    added: 2026-05-02
    revised: ""

  - contract: typed_event_invocation
    status: active
    pattern: signal
    description: "All inter-system events use C# typed event Action<T> delegates declared on MonoBehaviour classes. Invocation via ?.Invoke() only. No UnityEvent, no ScriptableObject event channels, no central EventBus."
    adr: docs/architecture/adr-0002-event-and-signal-architecture.md
    referenced_by:
      - docs/architecture/adr-0002-event-and-signal-architecture.md
    added: 2026-05-02
    revised: ""

  - contract: event_subscription_lifecycle
    status: active
    pattern: signal
    description: "Subscribe in Awake (not Start). Use subscribe-then-check for events fired from async callbacks (OnSaveReady, OnLevelLoaded). Scene-loaded MonoBehaviours must unsubscribe all events in OnDestroy. DDOL-to-DDOL subscriptions: no unsubscribe needed. No lambda subscribers — named instance methods only."
    adr: docs/architecture/adr-0002-event-and-signal-architecture.md
    referenced_by:
      - docs/architecture/adr-0002-event-and-signal-architecture.md
    added: 2026-05-02
    revised: ""

  - contract: dual_ready_coordination
    status: active
    pattern: direct_call
    description: "LevelProgression must wait for BOTH SaveSystem.IsReady AND LevelDataSystem.IsReady before calling GSM.LoadLevel(). Use subscribe-then-check for both events; gate the actual LoadLevel call with a TryLoadFirstLevel() method that only proceeds when _saveReady && _ldsReady."
    adr: docs/architecture/adr-0004-level-data-loading-strategy.md
    referenced_by:
      - docs/architecture/adr-0004-level-data-loading-strategy.md
    added: 2026-05-02
    revised: ""

  - contract: audio_volume_control
    status: active
    pattern: direct_call
    description: "All audio volume changes must go through IAudioSystem.SetSFXVolume(), SetAmbientVolume(), SetUIVolume(). Direct AudioMixer.SetFloat() calls are forbidden from outside AudioSystem — they would bypass PlayerPrefs persistence."
    adr: docs/architecture/adr-0011-audio-architecture.md
    referenced_by:
      - docs/architecture/adr-0011-audio-architecture.md
    added: 2026-05-02
    revised: ""

  - contract: level_complete_payload
    status: active
    pattern: signal
    description: "The level_complete event carries four fields: (int levelId, int moveCount, int parMoves, int sequenceId). GSM reads par_moves from LevelDataSystem before emitting. All consumers — InGameHUD, LevelCompleteUI, LevelProgression — must use par_moves from the event payload and must NOT query LDS for par_moves independently."
    adr: docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    referenced_by:
      - docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    added: 2026-05-03
    revised: ""

  - contract: coin_reward_delivery
    status: active
    pattern: signal
    description: "LevelCompleteUI delivers coin rewards by firing C# events (OnCoinRewardGranted, OnCoinBonusGranted) to Level Progression. Level Progression calls CE.AddCoins(). LevelCompleteUI must not call ICoinEconomy.AddCoins() directly. OnCoinRewardGranted fires in OnEnable — unconditionally, before the first rendered frame."
    adr: docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    referenced_by:
      - docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    added: 2026-05-03
    revised: ""

