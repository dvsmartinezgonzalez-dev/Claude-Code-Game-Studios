# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: singleton_lifetime_management
    status: active
    api: "DontDestroyOnLoad(gameObject) + Script Execution Order (Project Settings)"
    not: "Zenject/VContainer DI; lazy FindFirstObjectByType<T>() at runtime"
    adr: docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    reason: "Static Instance access is zero-cost; SEO gives explicit, auditable boot order without third-party packages"
    referenced_by:
      - docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    added: 2026-05-02
    revised: ""

  - purpose: atomic_file_write
    status: active
    api: "FileStream(path, FileMode.Create) + Write + Flush(flushToDisk:true) + close → File.Replace (if exists) / File.Move (first write)"
    not: "File.WriteAllText (no fsync guarantee); File.Move(src, dst, overwrite:true) (does not exist in .NET Standard 2.1)"
    adr: docs/architecture/adr-0003-save-system-design.md
    reason: "File.WriteAllText does not call fsync — file may be unflushed before rename; power loss produces corrupt save. File.Move 3-arg overload was added in .NET 5, not .NET Standard 2.1 (Unity 6.3 BCL target)."
    referenced_by:
      - docs/architecture/adr-0003-save-system-design.md
    added: 2026-05-02
    revised: ""

  - purpose: addressables_batch_load
    status: active
    api: "Addressables.LoadAssetsAsync<TextAsset>((object)label, perAssetCallback, true) — 3-argument form with releaseDependenciesOnFailure=true. Store handle in field. After all assets parsed: Addressables.Release(handle)."
    not: "2-argument LoadAssetsAsync form (removed in Addressables 2.x); Resources.Load (no memory management)"
    adr: docs/architecture/adr-0004-level-data-loading-strategy.md
    reason: "Addressables 2.x requires the 3rd bool parameter for partial-load failure cleanup. Handle must be stored or it is GC-eligible mid-load."
    referenced_by:
      - docs/architecture/adr-0004-level-data-loading-strategy.md
    added: 2026-05-02
    revised: ""

  - purpose: urp_render_feature_pattern
    status: active
    api: "ScriptableRendererFeature.AddRenderPasses() to enqueue pass; ScriptableRenderPass.RecordRenderGraph(RenderGraph, ContextContainer) for pass work"
    not: "SetupRenderPasses() (removed in Unity 6.3); Execute(ScriptableRenderContext, ref RenderingData) (compatibility-mode path, unavailable)"
    adr: docs/architecture/adr-0005-rendering-pipeline-configuration.md
    reason: "URP Compatibility Mode removed in Unity 6.3. All custom render features must use Render Graph API. SetupRenderPasses causes compile error."
    referenced_by:
      - docs/architecture/adr-0005-rendering-pipeline-configuration.md
    added: 2026-05-02
    revised: ""

  - purpose: touch_input
    status: active
    api: "UnityEngine.InputSystem.EnhancedTouch.EnhancedTouchSupport + Touch.activeTouches (Input System Package). Physics2D.OverlapPoint(worldPos, layerMask) for tap-to-object mapping."
    not: "Legacy Input class (Input.GetMouseButtonDown, Input.touches) — deprecated in Unity 6.x"
    adr: docs/architecture/adr-0007-input-handling-strategy.md
    reason: "Legacy Input class is deprecated. Input System Package is the required path in Unity 6.x. EnhancedTouchSupport provides allocation-free per-frame touch access."
    referenced_by:
      - docs/architecture/adr-0007-input-handling-strategy.md
    added: 2026-05-02
    revised: ""

  - purpose: mobile_safe_area
    status: active
    api: "Screen.safeArea → normalize by Screen.width/height → set RectTransform.anchorMin/Max on SafeAreaPanel child of Canvas. Applied in Awake() + OnRectTransformDimensionsChange()."
    not: "Hardcoded padding values; platform-specific native APIs; per-element offset code"
    adr: docs/architecture/adr-0008-ui-hierarchy-and-safe-area.md
    reason: "Screen.safeArea is the only Unity managed-code API for notch/home indicator insets on iOS and Android. SafeAreaPanel centralizes the logic in one reusable component."
    referenced_by:
      - docs/architecture/adr-0008-ui-hierarchy-and-safe-area.md
    added: 2026-05-02
    revised: ""

  - purpose: singleton_unsubscribe_null_guard
    status: active
    api: "if (X.Instance != null) { X.Instance.Event -= Handler; } in OnDestroy for all scene-loaded MonoBehaviours"
    not: "Unconditional X.Instance.Event -= Handler; in OnDestroy"
    adr: docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    reason: "On app quit or mid-scene-reload, DDOL singleton managers may be destroyed before scene-loaded MonoBehaviours. Unconditional unsubscribe throws NullReferenceException. Null guard is safe and Unity-idiomatic."
    referenced_by:
      - docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    added: 2026-05-03
    revised: ""

