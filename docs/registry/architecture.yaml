# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: runtime_singleton_scene_scan
    status: active
    description: "Systems must not call FindObjectOfType, FindFirstObjectByType, or FindObjectsByType to locate singleton managers at runtime. Use the static Instance reference instead."
    why: "O(n) scene scan on every access breaks the 60fps frame budget. FindObjectOfType is removed in Unity 6.0. Static Instance access is zero-cost and consistent with the SEO-enforced boot contract."
    adr: docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    added: 2026-05-02

  - pattern: scene_load_from_manager_awake
    status: active
    description: "No manager class may call SceneManager.LoadScene or SceneManager.LoadSceneAsync from within its Awake method. Scene transitions must be initiated from gameplay code at SEO 0 or later."
    why: "If a manager triggers a scene load before DontDestroyOnLoad executes, the manager's GameObject is destroyed with the outgoing scene before it escapes — silent, hard-to-diagnose failure."
    adr: docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    added: 2026-05-02

  - pattern: lambda_event_subscriber
    status: active
    description: "Event subscriptions must use named instance methods, not lambda expressions or anonymous methods. Example: 'event += (x) => DoThing(x)' is forbidden; 'event += HandleThing' is required."
    why: "Lambda subscribers allocate a closure object at subscription time. They also cannot be unsubscribed (the lambda reference is not stored), causing MissingReferenceException when scene-loaded consumers are destroyed."
    adr: docs/architecture/adr-0002-event-and-signal-architecture.md
    added: 2026-05-02

  - pattern: unity_event_for_inter_system
    status: active
    description: "UnityEvent must not be used for inter-system communication on gameplay hot paths (move events, board state, animation completion)."
    why: "UnityEvent.Invoke() allocates GC per call (internal iterator object). At 60fps with 3-5 taps/second, this creates sustained GC pressure on mobile. C# event Action<T> with ?.Invoke() is zero-allocation after subscription."
    adr: docs/architecture/adr-0002-event-and-signal-architecture.md
    added: 2026-05-02

  - pattern: three_arg_file_move
    status: active
    description: "File.Move(source, dest, overwrite: true) must not be used. The three-argument overload does not exist in .NET Standard 2.1 (Unity 6.3 BCL target) — it was added in .NET 5. Use File.Replace(source, dest, null) when destination exists, or two-arg File.Move(source, dest) for first write."
    why: "Compile error in Unity 6.3. Developers familiar with .NET 5+ may reach for the overload instinctively."
    adr: docs/architecture/adr-0003-save-system-design.md
    added: 2026-05-02

  - pattern: async_void_unity_lifecycle
    status: active
    description: "async void must not be used on Unity lifecycle methods: Awake, Start, OnApplicationPause, OnApplicationQuit, OnDestroy. These methods must be synchronous."
    why: "Unity does not await these methods. Any await expression causes Unity to return control to the engine mid-execution, allowing other systems to run before initialization completes — e.g., async void Awake() allows Start() on other MonoBehaviours to fire while Awake() is suspended. For OnApplicationPause: Unity returns control to the OS at the first await, abandoning the write before iOS suspension."
    adr: docs/architecture/adr-0003-save-system-design.md
    added: 2026-05-02

  - pattern: addressables_handle_unstored
    status: active
    description: "Every AsyncOperationHandle returned by Addressables must be stored in a field for the duration of the async operation. Anonymous or local-variable handles are GC-eligible mid-load and will cause the operation to silently abort."
    why: "GC-collected handle = Completed callback never fires; IsReady never set; game hangs at boot with no error. Silent failure is the worst class of bug."
    adr: docs/architecture/adr-0004-level-data-loading-strategy.md
    added: 2026-05-02

  - pattern: setup_render_passes_forbidden
    status: active
    description: "ScriptableRendererFeature.SetupRenderPasses() and URPRenderPipelineAsset.enableRenderCompatibilityMode must not be used or referenced anywhere in the codebase. Use AddRenderPasses() + RecordRenderGraph() instead."
    why: "URP Compatibility Mode was removed in Unity 6.3. Both APIs cause compile errors. Code from Unity 5.x/2022/2023 tutorials commonly uses SetupRenderPasses — copying this code into the project will break the build."
    adr: docs/architecture/adr-0005-rendering-pipeline-configuration.md
    added: 2026-05-02

  - pattern: direct_board_state_write
    status: active
    description: "No system other than GameStateManager may write to StackContents or TempSlotContents arrays, or to CurrentSequenceId. All board mutations must go through GSM.HandleMoveCommitted() or GSM.LoadLevel()."
    why: "Direct state writes by other systems break the monotonic sequence ID invariant, create race conditions with the watchdog, and make undo history inconsistent. GSM is the sole authoritative owner of board state."
    adr: docs/architecture/adr-0006-board-state-representation.md
    added: 2026-05-02

  - pattern: legacy_input_class
    status: active
    description: "Input.GetMouseButtonDown(), Input.touches, Input.GetKeyDown(KeyCode.Escape) and all other legacy Input class calls are forbidden. Use Input System Package (EnhancedTouch, Keyboard.current) instead."
    why: "Legacy Input class is deprecated in Unity 6.x. It cannot coexist cleanly with Input System Package and will be removed in a future Unity version."
    adr: docs/architecture/adr-0007-input-handling-strategy.md
    added: 2026-05-02

  - pattern: standalone_input_module
    status: active
    description: "StandaloneInputModule must not be used on EventSystem GameObjects when the Input System Package is active. Replace with InputSystemUIInputModule. All scenes must be verified before story Done."
    why: "StandaloneInputModule does not route Input System Package touch events to UGUI — buttons silently fail to respond to touch. Unity replaces this automatically on package installation but not for subsequently-created scenes."
    adr: docs/architecture/adr-0007-input-handling-strategy.md
    added: 2026-05-02

  - pattern: legacy_ui_text
    status: active
    description: "UI.Text (legacy Unity text component) must not be used anywhere in the project. All text must use TextMeshProUGUI."
    why: "UI.Text is deprecated in Unity 6.x and produces inferior rendering on high-DPI mobile screens. It also triggers GC from legacy mesh rebuilds. TextMeshProUGUI is the Unity-supported standard."
    adr: docs/architecture/adr-0008-ui-hierarchy-and-safe-area.md
    added: 2026-05-02

  - pattern: stop_all_coroutines_on_animation_system
    status: active
    description: "StopAllCoroutines() must not be called on AnimationSystem. Each coroutine (bolt move, celebration, glow ramp) must be stopped via its named Coroutine reference stored on the owning component."
    why: "StopAllCoroutines() on AnimationSystem would abort all in-flight bolt animations, celebration sequences, and glow ramps simultaneously — destroying unrelated visual states. Named handles enable surgical cancellation."
    adr: docs/architecture/adr-0009-bolt-animation-strategy.md
    added: 2026-05-02

  - pattern: material_property_block_sprite_renderer
    status: active
    description: "MaterialPropertyBlock must not be used to set properties on SpriteRenderer components in URP 2D. Use a second sprite overlay layer (GlowOverlay) for per-sprite emissive/HDR color changes."
    why: "MaterialPropertyBlock writes properties outside the SRP Batcher's CBUFFER, breaking batching for the affected sprite. In URP 2D where all bolt sprites batch together, each MaterialPropertyBlock call creates up to 11 batch splits. Overlay layer adds one extra draw call per glow event but preserves all existing batching."
    adr: docs/architecture/adr-0010-vfx-graph-and-bloom-mobile.md
    added: 2026-05-02

  - pattern: lcui_direct_ce_call
    status: active
    description: "LevelCompleteUI must not call ICoinEconomy.AddCoins() directly. Coin reward delivery must route through Level Progression: LevelCompleteUI fires OnCoinRewardGranted(amount) and OnCoinBonusGranted(amount) events; Level Progression subscribes and calls CE.AddCoins()."
    why: "Direct CE call from UI violates coin_balance ownership (ADR-0006). It creates a UI→Economy coupling that bypasses Level Progression's role as the routing authority for level outcomes."
    adr: docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    added: 2026-05-03

  - pattern: ad_watchdog_wait_for_seconds
    status: active
    description: "The LevelCompleteUI ad watchdog coroutine must not use WaitForSeconds or WaitForSecondsRealtime. Use a polling loop with yield return null and compare Time.realtimeSinceStartup against the recorded AD_PROCESSING entry time."
    why: "WaitForSeconds is frame-dependent and pauses when the app is backgrounded on iOS/Android. A phone call mid-ad-watch would permanently soft-lock the player in AD_PROCESSING with navigation buttons disabled. Time.realtimeSinceStartup continues advancing during suspension."
    adr: docs/architecture/adr-0012-hud-and-level-complete-ui-business-logic.md
    added: 2026-05-03

