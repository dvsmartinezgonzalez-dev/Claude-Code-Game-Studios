# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-05-03"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: singleton_boot_order
    status: active
    owner_system: all-managers (QualityTierSystem, SaveSystem, AudioSystem, GameStateManager, CoinEconomy, LevelProgression)
    adr: docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    interface: "Each manager exposes public static Instance { get; private set; } set in Awake. SEO order is the authoritative boot contract (see ADR-0001 table)."
    write_access: each-manager-owns-its-own-instance
    referenced_by:
      - docs/architecture/adr-0001-singleton-architecture-and-boot-sequence.md
    added: 2026-05-02
    revised: ""

  - state: level_record_cache
    status: active
    owner_system: LevelDataSystem
    adr: docs/architecture/adr-0004-level-data-loading-strategy.md
    interface: "LevelDataSystem.GetLevel(int levelId): LevelRecord — synchronous, O(1) dictionary lookup. Throws if not ready or level not found. IsReady must be true before calling."
    write_access: LevelDataSystem-only (populated once at startup, immutable thereafter)
    referenced_by:
      - docs/architecture/adr-0004-level-data-loading-strategy.md
    added: 2026-05-02
    revised: ""

  - state: rendering_quality_settings
    status: active
    owner_system: QualityTierSystem
    adr: docs/architecture/adr-0005-rendering-pipeline-configuration.md
    interface: "QualityTierSystem.ActiveTier (enum), DensityMultiplier (float 0.25/0.65/1.0), TargetFrameRate (int 30/60), SupportsVFXGraph (bool). All set once in Awake() [SEO -100], read-only thereafter."
    write_access: QualityTierSystem-only (set once at startup; player override via PlayerPrefs 'qts.tier')
    referenced_by:
      - docs/architecture/adr-0005-rendering-pipeline-configuration.md
    added: 2026-05-02
    revised: ""

  - state: board_state_arrays
    status: active
    owner_system: GameStateManager
    adr: docs/architecture/adr-0006-board-state-representation.md
    interface: "IReadOnlyList<int>[] StackContents, IReadOnlyList<int>[] TempSlotContents — read-only from outside GSM. Also: int StackDepth, TempSlotDepth, TempSlotCount, ColorCount, MoveCount, CurrentSequenceId (all read-only properties)."
    write_access: GameStateManager-only. No other system may write to StackContents or TempSlotContents arrays.
    referenced_by:
      - docs/architecture/adr-0006-board-state-representation.md
    added: 2026-05-02
    revised: ""

  - state: coin_balance
    status: active
    owner_system: CoinEconomy
    adr: docs/architecture/adr-0006-board-state-representation.md
    interface: "ICoinEconomy.GetCoinBalance(): int (read-only); AddCoins(amount, levelId, EarnSource): bool; SpendCoins(amount): bool; event OnCoinBalanceChanged(newBalance, delta). Persisted via SaveSystem.SetCoinBalance() on every change."
    write_access: CoinEconomy-only (AddCoins / SpendCoins are the only write paths; no direct field access)
    referenced_by:
      - docs/architecture/adr-0006-board-state-representation.md
    added: 2026-05-02
    revised: ""

