# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: is_breather
    status: active
    source: design/gdd/level-progression.md
    referenced_by:
      - design/gdd/level-progression.md
      # design/gdd/level-select-ui.md — add when authored; reads IsBreather to render tier indicator on tile
    variables:
      - level_id
    output_range: [false, true]
    expression: "is_breather = (level_id % 10 == 0)"
    notes: "Flag only — Level Progression emits this property; no difficulty enforcement is applied by LP.
      Breather levels are authored one tier lower (e.g., a Tier 3 level authored at Tier 2 difficulty)
      by the level design pipeline, which emits a build warning if the authored tier appears inconsistent.
      Level Select UI uses this to render a visual indicator on breather level tiles."
    added: 2026-04-21
    revised: ""

  - name: is_locked
    status: active
    source: design/gdd/level-progression.md
    referenced_by:
      - design/gdd/level-progression.md
      - design/gdd/save-persistence.md    # current_level_id persisted here; is_locked depends on current_level_id being correct after cold start
      # design/gdd/level-select-ui.md — add when authored; reads IsLocked per tile to show lock overlay
    variables:
      - level_id
      - current_level_id
    output_range: [false, true]
    expression: "is_locked(level_id) = (level_id > current_level_id)"
    notes: "current_level_id = highest authorized level (current or next-to-play). After completing level N,
      current_level_id advances to N+1. IsLocked(current_level_id) always returns false — the player's
      current level is never locked. Level Select UI must not cache this value; re-query on each focus."
    added: 2026-04-21
    revised: ""

  - name: best_stars_update
    status: active
    source: design/gdd/level-progression.md
    referenced_by:
      - design/gdd/level-progression.md
      - design/gdd/save-persistence.md    # persists best_stars per level_id; WriteCompletionAtomic enforces best_stars' = max(current, earned) and write-once completion_version
      # design/gdd/level-select-ui.md — add when authored; reads best_stars to render star badges
    variables:
      - current_best_stars
      - stars_earned
    output_range: [0, 3]
    expression: "best_stars' = max(current_best_stars, stars_earned)"
    notes: "Progress is monotonically non-decreasing. current_best_stars = 0 means never completed.
      stars_earned = 0 events are discarded by LP before this formula runs (AC-34). Save & Persistence
      GDD must store best_stars as int [0–3] per level_id and support the atomic write requirement
      with current_level_id advance (EC-16 / AC-18)."
    added: 2026-04-21
    revised: ""

  - name: level_completed_event
    status: active
    source: design/gdd/level-progression.md
    referenced_by:
      - design/gdd/level-progression.md
      - design/gdd/coin-economy.md          # subscribes to LevelCompleted for analytics; award arrives separately via CE.AddCoins()
    value: "LevelCompleted(stars: int, level_id: int, move_count: int, par_moves: int)"
    unit: string (event name + signature)
    notes: "Emitted by Level Progression exactly once per completion in COMPLETION_FLOW. The event/callback
      boundary between LP and Coin Economy — LP never calls Coin Economy directly. stars=1–3 (0 is
      discarded by LP before emission). level_id = current_level_id at completion time. move_count from
      GSM level_complete payload. par_moves from LDS GetLevel(level_id).par_moves. Coin Economy GDD must
      add itself to referenced_by when authored."
    added: 2026-04-21
    revised: ""

  - name: bolt_count_invariant
    status: active
    source: design/gdd/level-data-system.md
    referenced_by:
      - design/gdd/level-data-system.md
      - design/gdd/game-state-manager.md    # GSM verifies this when initializing board state
      - design/gdd/sort-mechanic.md         # Sort Mechanic win condition relies on this invariant
    variables:
      - color_count
      - stack_depth
    output_range: [6, 64]
    expression: "total_bolts = color_count × stack_depth; each color_id appears exactly stack_depth times"
    notes: "Two stacked checks: Check 1 (total count) is a fast early-exit; Check 2 (per-color count)
      is the sufficient condition. Temp slots are excluded — they contain zero bolts at level start.
      If GSM or Sort Mechanic use different values, surface the conflict before writing those GDDs."
    added: 2026-04-16
    revised: ""

