name: Acquire Unity Activation File

# Run this once manually to get the .alf file needed for license activation.
# After completing activation, this workflow is no longer needed.
on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.0f1

      - name: Upload activation file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.3.0f1_activation_file
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 1
